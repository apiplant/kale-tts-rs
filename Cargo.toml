[package]
name = "kale-tts-rs"
build = "build.rs"
version = "0.1.0"
edition = "2024"
description = "Native Rust and Candle runtime for Kale TTS models"
license = "MIT"
readme = "README.md"
repository = "https://github.com/apiplant/kale-tts-rs"
exclude = ["studio/node_modules/**", "website/**"]

[[bin]]
name = "kale-tts"
path = "src/main.rs"

[features]
default = []
cuda = ["candle-core/cuda", "candle-nn/cuda"]
metal = ["candle-core/metal", "candle-nn/metal"]

[dependencies]
anyhow = "1"
base64 = "0.22"
candle-core = "0.11.1"
candle-nn = "0.11.1"
candle-onnx = "0.11.1"
clap = { version = "4.6", features = ["derive", "env"] }
futures-channel = "0.3"
mime_guess = "2"
ntex = "4.10"
prost = "0.14"
pytorch-reader = "=0.23.0-pre.2"
rquickjs = { version = "0.14", features = ["bindgen"] }
rust-embed = "8.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
safetensors = "0.8"
ureq = "2.12"
zip = { version = "=9.8.2", default-features = false }

