name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  binaries:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: pnpm --dir studio install --frozen-lockfile
      - run: pnpm --dir studio build
      - run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Archive
        shell: bash
        run: |
          set -euo pipefail
          archive="kale-tts-$GITHUB_REF_NAME-${{ matrix.target }}.tar.gz"
          mkdir -p package
          install -Dm755 "target/${{ matrix.target }}/release/kale-tts" package/kale-tts
          cp README.md LICENSE package/
          cp vendor/LICENSE package/LICENSE-KaleComputer
          cp vendor/KOKORO-LICENSE package/LICENSE-Kokoro-Candle
          cp vendor/THIRD_PARTY_NOTICES.md package/
          tar -C package -czf "$archive" .
          sha256sum "$archive" > "$archive.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: kale-tts-${{ matrix.target }}
          path: kale-tts-*.tar.gz*
          if-no-files-found: error
  publish:
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: kale-tts-*
          merge-multiple: true
      - run: cd dist && sha256sum -c *.sha256
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
