<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>kale-tts-rs</title>
    <meta name="description" content="Local speech synthesis with Kale Nano, Tiny, and Base in Rust." />
    <link rel="icon" href="/mark.svg" type="image/svg+xml" />
    <link rel="canonical" href="https://kale-tts-rs.apiplant.com/" />
    <meta property="og:title" content="kale-tts-rs" />
    <meta property="og:description" content="Local speech synthesis with Kale Nano, Tiny, and Base in Rust." />
    <script>
      try {
        const theme = localStorage.getItem("theme");
        if (theme === "dark" || theme === "light") document.documentElement.dataset.theme = theme;
      } catch {}
    </script>

    <div id="root" data-page="home"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
